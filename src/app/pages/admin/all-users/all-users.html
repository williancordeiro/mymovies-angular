<div class="flex flex-col gap-6 items-center justify-center">
    <h1 class="text-3xl">Todos os Usuários</h1>
    <table
        class="border-2 border-accent w-full max-w-7xl text-center"
    >
        <thead
            class="text-xl"
        >
            <tr
                class="border-b border-neutral-600"
            >
                <th class="border-e border-neutral-600 py-1">ID</th>
                <th class="border-e border-neutral-600">Nome</th>
                <th class="border-e border-neutral-600">Identificador</th>
                <th class="border-e border-neutral-600">Email</th>
                <th class="border-e border-neutral-600">Ações</th>
            </tr>
        </thead>
        <tbody
            class="text-lg"
        >
            @for (user of users(); track user.id) {
            <tr
                class="cursor-default border-b border-neutral-600"
            >
                <td class="py-1 border-e border-neutral-600">{{ user.id }}</td>
                <td class="border-e border-neutral-600">{{ user.username }}</td>
                <td class="border-e border-neutral-600">{{ user.handle }}</td>
                <td class="border-e border-neutral-600">{{ user.email }}</td>
                <td class="text-sm flex gap-3 my-auto justify-center items-center mt-1">
                    <button
                        class="py-1 px-1.5 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors duration-200 cursor-pointer"
                        #blockButton
                    >
                       <fa-icon [icon]="faLock" class="text-white" /> 
                    </button>
                    <button
                        class="py-1 px-1.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200 cursor-pointer"
                        #banButton
                    >
                        <fa-icon [icon]="faBan" class="text-white" />
                    </button>
                    <button
                        class="py-1 px-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors duration-200 cursor-pointer"
                        #promoteButton
                    >
                        <fa-icon [icon]="faStar" class="text-white" />
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
