<div [routerLink]="['/movie', movie.id]"
    class="group cursor-pointer flex gap-6 bg-background_black p-5 rounded-brand shadow-lg transition-transform duration-300 hover:shadow-accent/20 hover:shadow-xl">

    <!-- imagem do filme -->
    <div class="w-60 h-76 shrink-0 overflow-hidden rounded-brand">
        <img [src]="'https://image.tmdb.org/t/p/w300' + movie.poster_path" [alt]="movie.title"
            class="w-full h-full object-fill">
    </div>

    <!-- informacoes do filme -->
    <div class="flex flex-col grow justify-between py-1">
        <div>
            <!-- titulo do filme -->
            <h3 class="font-headline text-2xl font-bold text-accent truncate" [title]="movie.title">
                {{ movie.title }}
            </h3>

            <!-- Nota e Ano -->
            <div class="flex flex-col gap-4 mt-2 text-base text-secondary">
                <span class="inline-flex items-center gap-1.5 text-accent font-bold bg-accent/10 px-2 py-1 rounded-brand border border-accent/20 w-fit">
                    <fa-icon [icon]="faStar"></fa-icon>
                    {{ (movie.mymovies_rating_average) | number:'1.1-1' }}
                </span>
                <span class="opacity-75">
                    {{ movie.release_date | date:'yyyy' }}
                </span>
            </div>
        </div>

        <div
            class="p-2 bg-neutral-950 rounded-lg"
        >
            <p class="text-base text-neutral-300 line-clamp-3" [title]="movie.overview">
                {{ movie.overview }}
            </p>
        </div>
    </div>
</div>
