<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Overlay Preto -->
    <div class="absolute inset-0 bg-black/80 transition-opacity" (click)="closeModal()"></div>

    <!-- Modal Content -->
    <div class="relative bg-background_default border border-white/10 rounded-brand shadow-2xl w-full max-w-md overflow-hidden transform transition-all animate-fade-in-up">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-headline font-bold text-primary">
                    {{ mode === 'tmdb' ? 'Detalhes do Filme' : (movie?.id ? 'Editar Filme' : 'Novo Filme Personalizado') }}
                </h2>
                <button (click)="closeModal()" class="text-neutral-400 hover:text-white transition-colors">
                    <fa-icon [icon]="faTimes" size="lg"></fa-icon>
                </button>
            </div>

            <form [formGroup]="movieForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-white mb-1">Título</label>
                    <input type="text" formControlName="title"
                        class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all placeholder:text-neutral-600 disabled:opacity-50"
                        placeholder="Ex: O Poderoso Chefão">
                    <p *ngIf="apiErrors['title']" class="text-red-500 text-xs mt-1">{{ apiErrors['title'] }}</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-white mb-1">Descrição</label>
                    <textarea formControlName="description" rows="3"
                        class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all placeholder:text-neutral-600 disabled:opacity-50"
                        placeholder="Sinopse ou comentários..."></textarea>
                    <p *ngIf="apiErrors['description']" class="text-red-500 text-xs mt-1">{{ apiErrors['description'] }}</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">Ano</label>
                        <input type="number" formControlName="release_year"
                            class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all placeholder:text-neutral-600 disabled:opacity-50"
                            placeholder="Ex: 1972">
                        <p *ngIf="apiErrors['release_year']" class="text-red-500 text-xs mt-1">{{ apiErrors['release_year'] }}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">URL do Pôster</label>
                        <input type="text" formControlName="poster_url"
                            class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all placeholder:text-neutral-600 disabled:opacity-50"
                            placeholder="https://...">
                        <p *ngIf="apiErrors['poster_url']" class="text-red-500 text-xs mt-1">{{ apiErrors['poster_url'] }}</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">Nota (1 a 5)</label>
                        <input type="number" formControlName="rating"
                            class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all placeholder:text-neutral-600 disabled:opacity-50"
                            placeholder="5">
                        <p *ngIf="apiErrors['rating']" class="text-red-500 text-xs mt-1">{{ apiErrors['rating'] }}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">Status</label>
                        <select formControlName="status"
                            class="w-full bg-neutral-900 border border-white/10 rounded-brand px-4 py-2 text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all disabled:opacity-50">
                            <option value="">Selecione...</option>
                            <option value="Vou assistir">Vou assistir</option>
                            <option value="Assistido">Assistido</option>
                            <option value="Não terminei">Não terminei</option>
                        </select>
                        <p *ngIf="apiErrors['status']" class="text-red-500 text-xs mt-1">{{ apiErrors['status'] }}</p>
                    </div>
                </div>

                <div class="mt-8 flex justify-between gap-3 pt-4 border-t border-white/10">
                    <button *ngIf="movie?.id" type="button" (click)="removeMovie()"
                        class="px-5 py-2 rounded-brand font-medium text-red-500 hover:text-red-400 hover:bg-red-500/10 transition-colors flex items-center gap-2">
                        <fa-icon [icon]="faTrash"></fa-icon> Remover
                    </button>
                    <div *ngIf="!movie?.id"></div> <!-- Placeholder for flex-between -->

                    <div class="flex gap-2">
                        <button type="button" (click)="closeModal()"
                            class="px-5 py-2 rounded-brand font-medium text-neutral-400 hover:text-white hover:bg-white/5 transition-colors">
                            Fechar
                        </button>
                        <button *ngIf="mode === 'custom'" type="submit" [disabled]="isSubmitting"
                            class="px-5 py-2 rounded-brand font-medium bg-accent text-white hover:bg-accent/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-lg shadow-accent/20 flex items-center gap-2">
                            <fa-icon *ngIf="!isSubmitting" [icon]="faSave"></fa-icon>
                            <span *ngIf="isSubmitting" class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span>
                            Salvar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
