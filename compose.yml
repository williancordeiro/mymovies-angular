services:
  angular:
    build:
      context: .
      dockerfile: docker/angular/Dockerfile
    container_name: angular
    volumes:
    - dist-volume:/app/dist/my-movies-angular/browser
  
  nginx:
    build: ./docker/nginx
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - dist-volume:/usr/share/nginx/html
    depends_on:
      angular:
        condition: service_completed_successfully

volumes:
  dist-volume: